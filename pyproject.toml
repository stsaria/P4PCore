[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "P4PCore"
dynamic = ["version"]
description = "P4PCore is library for secure p2p communication."
dependencies = [
    "cryptography",
    "xxhash"
]
license = { file = "LICENSE" }
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
